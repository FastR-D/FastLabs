[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".fastlab", ".venv"]

[tool.ruff.lint]
# Start by enforcing correctness classes over the compatibility code. Style can
# be ratcheted module by module without mixing mechanical churn into refactors.
select = ["E9", "F401", "F63", "F7", "F82"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["fastlab", "agent_adapter", "multitenancy", "server"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.coverage.xml]
output = "coverage.xml"
