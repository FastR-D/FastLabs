name: Validate and deploy FastLabs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: validate-fastlabs-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --target vendor -r requirements.txt -r requirements-fastcas.txt
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: vendor
      - name: Checkout pinned FastDeploy packager
        uses: actions/checkout@v4
        with:
          repository: FastR-D/FastDeploy
          ref: cc223a0b83b0ef2389974dd70a4b74148cd1af87
          path: .fastdeploy-tools
          persist-credentials: false
      - name: Package the tested runtime
        run: python3 .fastdeploy-tools/scripts/package.py fastlabs --output "$RUNNER_TEMP/fastlabs-release"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/fastlabs-release/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: FastR-D/FastDeploy/.github/workflows/deploy.yml@cc223a0b83b0ef2389974dd70a4b74148cd1af87
    with:
      app: fastlabs
      artifact-name: release-${{ github.sha }}
      # These values are literal KEY=value entries; do not add shell quotes.
      # Code-relative paths are supplied by the trusted FastDeploy server profile.
      runtime-env: |
        FASTLAB_CODEX_BIN=/home/dev/.npm-global/bin/codex
    secrets:
      SSH_HOST: ${{ secrets.FASTRD_SSH_HOST }}
      SSH_PORT: ${{ secrets.FASTRD_SSH_PORT }}
      SSH_USER: ${{ secrets.FASTRD_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.FASTRD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.FASTRD_SSH_KNOWN_HOSTS }}
      runtime-secrets: '{}'
