name: FastLab CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fastlab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test and sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap socat
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt coverage ruff
      - name: Ruff correctness checks
        run: ruff check fastlab server.py tests deploy
      - name: Python tests and coverage
        run: |
          set -o pipefail
          coverage run -m unittest discover -s tests -v 2>&1 | tee test-output.log
          if grep -Fq "sandbox forbids local ports" test-output.log; then
            echo "HTTP contract tests were skipped because local ports were unavailable"
            exit 1
          fi
          coverage report
          coverage xml
      - name: Deployment smoke test
        run: python deploy/smoke_test.py

  frontend:
    name: Native ES modules (Node 22)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install FastLab runtime dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Native module unit tests
        run: npm test
      - name: Install pinned Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.63.0
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Playwright core flows
        env:
          FASTLAB_TEST_PYTHON: python
        run: npm run test:e2e

  acceptance:
    name: Required checks complete
    if: always()
    needs: [python, frontend]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if a required job failed
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          test "$PYTHON_RESULT" = success
          test "$FRONTEND_RESULT" = success
